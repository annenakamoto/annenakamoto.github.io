# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Anne Nakamoto
email: aanakamo@ucsc.edu
description: >- # this means to ignore newlines until "baseurl:"
  Bioinformatics PhD Candidate at UC Santa Cruz.
#twitter_username: username
github_username: annenakamoto
minimal_mistakes_skin: default

head_scripts:
  - /assets/css/custom.css

search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
#remote_theme: benbalter/retlab
# Outputting
#permalink: /:categories/:title/
#paginate: 5 # amount of posts to show
#paginate_path: /page:num/
#timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

#include:
#  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  #- jekyll-feed
  - jemoji
  - jekyll-include-cache
#  - jekyll-remote-theme

author:
  name   : "Anne Nakamoto"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Bioinformatics PhD Candidate at UC Santa Cruz."
  links:
    - label: "aanakamo@ucsc.edu"
      icon: "fa-regular fa-envelope"
      url: "mailto: aanakamo@ucsc.edu"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=d3Ndg64AAAAJ&hl=en&oi=ao"
    - label: "ORCID:0000-0002-6753-7238"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-6753-7238"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/annenakamoto"
    - label: "@annenakamoto"
      icon: "fab fa-fw fa-bluesky"
      url: "https://bsky.app/profile/annenakamoto.bsky.social"

footer:
  links:
    - label: "aanakamo@ucsc.edu"
      icon: "fa-regular fa-envelope"
      url: "mailto: aanakamo@ucsc.edu"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=d3Ndg64AAAAJ&hl=en&oi=ao"
    - label: "ORCID:0000-0002-6753-7238"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-6753-7238"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/annenakamoto"
    - label: "@annenakamoto"
      icon: "fab fa-fw fa-bluesky"
      url: "https://bsky.app/profile/annenakamoto.bsky.social"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

atom_feed:
  hide: true
